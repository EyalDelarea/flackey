[project]
name = "krater"
version = "0.1.0"
description = "Personal DJ library builder with a desktop GUI: paste a link -> verified, tagged tracks -> Rekordbox"
requires-python = ">=3.12,<3.13"
dependencies = [
  "telethon>=1.44,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "curl_cffi>=0.7",
  "httpx>=0.27",
  "yt-dlp>=2026.8",
  "mutagen>=1.47",
  "rapidfuzz>=3.9",
  "numpy>=2.0",
  "typer>=0.12",
  "pydantic-settings>=2.4",
  "pywebview>=6.2.1",
  "pyyaml>=6",
]

[project.scripts]
krater = "krater.cli:app"
# The command this project shipped under before the rename, kept pointing at the same entry point. One
# line, and it is the only part of the rename the owner's muscle memory (and shell history) would feel.
crate = "krater.cli:app"

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krater"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.importlinter]
root_package = "krater"

[[tool.importlinter.contracts]]
name = "cli -> app -> surfaces -> worker -> adapters -> domain -> leaves"
type = "layers"
containers = ["krater"]
layers = [
  "cli",
  "desktop",
  "app",
  "web",
  "soulseek_link",
  "worker : events : inbox",
  "attempts",
  "library : export : tag : verify : store : catalog : deezer : youtube : source : telegram : convert : fingerprint",
  "lossless",
  "match : identify",
  "notify : config : models : logsetup",
  "slskd_process",
  "slskd_binary",
  "slskd_config",
]
exhaustive = true
