name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.4 or v0.1.4"
        required: true

# Read-only on purpose: every write (pushing the bump branch and the tag, opening and auto-merging the
# PR) goes through RELEASE_PAT, never GITHUB_TOKEN: pushes and PRs made with GITHUB_TOKEN don't trigger
# other workflows, so the checks + build this release depends on would never run and the auto-merge
# would wait forever. The PAT is handed only to the two steps that write, and only for their own git
# and gh commands: it is never written into the checkout's git config, so nothing else in the job
# (sed, check_version.sh) can pick it up.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Bump version, tag, and hand off to the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The repo is public: later fetches need no credentials, and pushes pass the PAT per command.
          persist-credentials: false
          ref: main
          fetch-depth: 0

      - name: Validate requested version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          raw="$RAW_VERSION"
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid version::Use X.Y.Z or vX.Y.Z, got '$raw'."
            exit 1
          fi

          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check for an existing tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          git fetch --tags origin

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error title=Tag already exists::$tag already exists. Pick a new version."
            exit 1
          fi

      - name: Bump version in the tree
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          sed -i -E "s/^version = \"[^\"]*\"/version = \"$version\"/" pyproject.toml
          sed -i -E "s/^__version__ = \"[^\"]*\"/__version__ = \"$version\"/" src/flackey/__init__.py
          # uv.lock records the project's own version too; edit just that line so a release
          # never re-resolves dependencies.
          sed -i -E "/^name = \"flackey\"$/{n;s/^version = \"[^\"]*\"/version = \"$version\"/}" uv.lock
          packaging/check_version.sh "${{ steps.version.outputs.tag }}"

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open and auto-merge the version bump PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          branch="release/$tag"
          # The PAT as an HTTP header for this one push, the way actions/checkout passes a token, rather
          # than in the remote URL or the git config.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "release: $tag"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "$branch"

          gh pr create --base main --head "$branch" --title "release: $tag" \
            --body "Automated version bump for $tag." --label ignore-for-release
          gh pr merge "$branch" --auto --squash

      - name: Wait for the version bump to land on main
        if: steps.bump.outputs.changed == 'true'
        env:
          # Only reads the PR's state: the workflow's own read-only token is enough.
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          branch="release/${{ steps.version.outputs.tag }}"
          for _ in $(seq 1 80); do
            state="$(gh pr view "$branch" --json state -q .state)"
            case "$state" in
              MERGED) echo "$branch merged."; exit 0 ;;
              CLOSED) echo "::error::PR for $branch was closed without merging."; exit 1 ;;
            esac
            sleep 15
          done

          echo "::error::Timed out waiting for $branch to merge."
          exit 1

      - name: Tag the released commit
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          # Kept in an unexported shell variable, so check_version.sh below never sees the PAT.
          auth="$(printf 'x-access-token:%s' "$RELEASE_PAT" | base64 -w0)"
          echo "::add-mask::$auth"
          unset RELEASE_PAT
          git fetch origin main
          git checkout -B main origin/main
          packaging/check_version.sh "$tag"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin "$tag"
