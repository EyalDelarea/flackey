# Every push and pull request: the four checks the README lists for development, plus a type-checked
# build of the web UI. On a push to main (or a version tag) the green checks gate a macOS installer
# build; on a version tag that installer is published as a GitHub Release.
name: checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ruff, lint-imports, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: ruff
        run: uv run ruff check src tests
      - name: lint-imports
        run: uv run lint-imports
      - name: pytest
        run: uv run pytest -q

  web:
    name: vitest and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm --prefix web ci
      - name: vitest
        run: npm --prefix web test -- --run
      - name: build
        run: npm --prefix web run build

  mac:
    name: Flackey installer (Apple Silicon)
    needs: [python, web]
    if: github.event_name == 'push'
    runs-on: macos-14
    env:
      # Only baked into the build (by packaging/build_app.sh) on a tagged release; a plain push to main
      # builds a keyless copy whose setup screen asks for keys instead. Keeps the keys off every push's
      # installer artifact -- they only need to reach users through an actual release. Never printed.
      FLACKEY_TELEGRAM_API_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TELEGRAM_API_ID || '' }}
      FLACKEY_TELEGRAM_API_HASH: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TELEGRAM_API_HASH || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Tag matches the version in the tree
        if: startsWith(github.ref, 'refs/tags/v')
        run: packaging/check_version.sh "$GITHUB_REF_NAME"
      - name: Cache helper downloads
        uses: actions/cache@v6
        with:
          path: packaging/build/helpers
          key: helpers-${{ hashFiles('packaging/fetch_helpers.sh') }}
      - name: Build
        run: packaging/build_app.sh
      - name: Smoke-launch
        run: packaging/smoke.sh packaging/build/dist/Flackey.app
      - name: Update helper is inside the signed bundle
        # A bundle published without the helper looks perfect until someone presses Update months
        # later and nothing can swap it.
        run: |
          test -x packaging/build/dist/Flackey.app/Contents/Frameworks/bin/flackey-update-helper
          codesign --verify --deep --strict packaging/build/dist/Flackey.app
      - name: Helper refuses what it should
        # The only job on a Mac, so the only one that can compile the helper; the python job runs on
        # ubuntu and skips these.
        run: uv run pytest tests/test_update_helper.py -q
      - name: Installer
        run: |
          packaging/build_installer.sh
          cd packaging/build && shasum -a 256 Flackey.pkg > Flackey.pkg.sha256 && cat Flackey.pkg.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: Flackey.installer
          path: |
            packaging/build/Flackey.pkg
            packaging/build/Flackey.pkg.sha256
            packaging/build/Flackey-*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: mac
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - uses: actions/download-artifact@v8
        with:
          name: Flackey.installer
          path: dist
      - name: latest.json
        run: packaging/latest_json.sh "$GITHUB_REF_NAME" dist/Flackey.pkg dist/Flackey.pkg.sha256 | tee dist/latest.json
      - name: Sign the update archive
        # Here rather than in the mac job: this is the only step that needs the private key, and it
        # should not run alongside npm install and PyInstaller.
        #
        # An unset secret is not a failure -- the script says so and the release publishes the zip
        # unsigned, which reads to every installed copy as "no seamless update here, use the installer".
        env:
          FLACKEY_UPDATE_SIGNING_KEY: ${{ secrets.FLACKEY_UPDATE_SIGNING_KEY }}
        # --no-project: the script reads the signed-message format straight out of src/, so none of
        # the app's macOS-shaped dependencies need to resolve on this runner.
        run: uv run --no-project --with cryptography packaging/sign_archive.py dist/Flackey-"${GITHUB_REF_NAME#v}".zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          zip="dist/Flackey-${GITHUB_REF_NAME#v}.zip"
          assets=(dist/Flackey.pkg dist/Flackey.pkg.sha256 dist/latest.json)
          # Both optional and independently so -- the .sig is missing whenever the signing secret is
          # unset -- and publishing the pkg must not depend on either.
          if [[ -f "$zip" ]]; then
            assets+=("$zip")
            if [[ -f "$zip.sig" ]]; then
              assets+=("$zip.sig")
            else
              echo "::notice title=Unsigned release::No $zip.sig; installed copies will update by installer."
            fi
          else
            echo "::warning title=No update archive::$zip was not built."
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag --title "Flackey ${GITHUB_REF_NAME#v}" --generate-notes
