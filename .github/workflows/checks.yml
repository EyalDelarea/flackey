# Every push and pull request: the four checks the README lists for development, a type-checked build
# of the web UI, and the test suite again on macOS, on Windows, and with real ffmpeg/ffprobe/fpcalc
# (the audio tests skip without them). The ruff/pytest and web jobs gate two installer builds; the
# other test jobs run alongside them and gate the release:
#   - macOS (Flackey.pkg for Apple Silicon, Flackey-Intel.pkg for Intel Macs), on a push to main or a
#     version tag, and on a pull request that touches what the build is made of (packaging/,
#     pyproject.toml, uv.lock, this file);
#   - Windows (Flackey-Setup.exe), on every push *and* pull request -- nobody on the project has a
#     Windows machine, so a PR's artifact, installed in a VM, is how a Windows change gets tried.
# On a version tag both installers are published together as one GitHub Release: a release when the
# tagged commit is on main, a pre-release (which the app and the site skip) when it is not.
name: checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  # A newer push to a PR replaces the older run. On main and on tags every run finishes: cancelling one
  # there once threw away the run a release bump was waiting on. (GitHub still keeps only one *pending*
  # run per group, so a burst of merges can drop a queued main run; the next one covers it.)
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref != 'refs/heads/main' }}

jobs:
  changes:
    # Which parts of the tree a pull request touches, so the Mac installer is built on a PR only when
    # its ingredients changed. Pull requests only: a push builds it unconditionally.
    name: changed paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mac_installer: ${{ steps.filter.outputs.mac_installer }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            mac_installer:
              - "packaging/**"
              - "pyproject.toml"
              - "uv.lock"
              - ".github/workflows/checks.yml"

  python:
    name: ruff, lint-imports, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Pinned rather than "latest": the same uv on every run, the release's signing step included.
          # 0.13.9 is the version every job had been resolving to (v0.8.1 was built and signed with it).
          version: "0.13.9"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: ruff
        run: uv run ruff check src tests
      - name: lint-imports
        run: uv run lint-imports
      - name: pytest
        run: uv run pytest -q

  python-audio:
    name: pytest with ffmpeg and fpcalc
    # The audio tests skip wherever ffmpeg/ffprobe/fpcalc are missing, which is every other job. They
    # get their own job because running them inside the job above added about 55s to it, and the
    # installer builds wait on that one. Here they run alongside the rest, off the critical path.
    runs-on: ubuntu-latest
    # Passing runs take 17 to 48 minutes; the cap is for a hang, which otherwise holds the job for six hours.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
      - name: ffmpeg, ffprobe, fpcalc
        # Static builds from GitHub releases, checked against pinned digests: a few seconds, where apt
        # takes tens of them. Without these every requires_ffmpeg / requires_fpcalc test skips.
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/audio-tools"
          mkdir -p "$bin" && cd "$bin"
          ff=https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1
          curl -fsSL --retry 3 -o ffmpeg.gz "$ff/ffmpeg-linux-x64.gz" &
          curl -fsSL --retry 3 -o ffprobe.gz "$ff/ffprobe-linux-x64.gz" &
          curl -fsSL --retry 3 -o fpcalc.tar.gz \
            https://github.com/acoustid/chromaprint/releases/download/v1.6.1/chromaprint-fpcalc-1.6.1-linux-x86_64.tar.gz &
          wait
          sha256sum -c - <<'SUMS'
          bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa  ffmpeg.gz
          25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067  ffprobe.gz
          fc16cd37a70168040bc9ceb45f1d4d1216f5a75bc4c9cf8564bea70ac6a45733  fpcalc.tar.gz
          SUMS
          gunzip ffmpeg.gz ffprobe.gz
          tar -xzf fpcalc.tar.gz --strip-components=1 && rm fpcalc.tar.gz
          chmod +x ffmpeg ffprobe fpcalc
          ./ffmpeg -hide_banner -version | head -1 && ./fpcalc -version
          echo "$bin" >> "$GITHUB_PATH"
      - name: Cache the slim ffmpeg build
        id: slim-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/build/helpers
          key: slim-ffmpeg-linux-${{ hashFiles('packaging/build_ffmpeg.sh') }}
      - name: Slim ffmpeg, ffprobe
        # The ones the installers ship (packaging/build_ffmpeg.sh), built for Linux so
        # tests/test_slim_ffmpeg.py can hold them to the full build above. Two minutes, then cached.
        run: |
          set -euo pipefail
          if [[ "${{ steps.slim-cache.outputs.cache-hit }}" != true ]]; then
            sudo apt-get install -y -qq nasm zlib1g-dev
          fi
          packaging/build_ffmpeg.sh "$RUNNER_TEMP/slim-ffmpeg"
          echo "FLACKEY_SLIM_FFMPEG=$RUNNER_TEMP/slim-ffmpeg" >> "$GITHUB_ENV"
      - name: Install
        run: uv sync --frozen
      - name: pytest (files that use the audio tools)
        # Every test file that gates on the tools (conftest's requires_ffmpeg / requires_fpcalc, or the
        # has_* checks), found at run time so a new one is picked up without editing this. -rs lists
        # every skip, so the log shows the audio tests ran rather than skipped.
        run: |
          set -euo pipefail
          mapfile -t files < <(grep -rlE --include='test_*.py' 'requires_(ffmpeg|fpcalc)|has_(ffmpeg|fpcalc)' tests | sort)
          (( ${#files[@]} )) || { echo "::error::no test file uses the audio tools; this job selects nothing"; exit 1; }
          echo "${files[@]}"
          uv run pytest -q -rs "${files[@]}"

  python-mac:
    name: pytest (macOS)
    # The primary platform, and the only runner that can compile and exercise the update helper
    # (tests/test_update_helper.py). Runs alongside the other test jobs, off the critical path.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: pytest
        run: uv run pytest -q

  python-windows:
    name: pytest (Windows)
    runs-on: windows-latest
    env:
      # Python on Windows opens text files in the ANSI code page unless told otherwise; the tests (like
      # the Linux run) assume UTF-8. Only here: the build job below leaves it unset so the packaged app
      # is smoke-tested the way it runs on a real machine.
      PYTHONUTF8: 1
    steps:
      - name: Check out with LF line endings
        # The Windows runner's git converts to CRLF on checkout (core.autocrlf=true). Keeping the bytes
        # identical to Linux stops fixtures and file comparisons from differing only on this runner.
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      # ruff and lint-imports read source, not the platform: the ubuntu job is enough for them.
      - name: pytest
        run: uv run pytest -q

  web:
    name: vitest and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm --prefix web ci
      - name: vitest
        run: npm --prefix web test -- --run
      - name: build
        run: npm --prefix web run build

  mac:
    name: Flackey installer (Apple Silicon)
    needs: [changes, python, web]
    # `changes` is skipped on a push, so the default "every need succeeded" rule would skip this too;
    # the expression restates it for the jobs that do gate the build.
    if: >-
      !cancelled() && needs.python.result == 'success' && needs.web.result == 'success' &&
      (github.event_name == 'push' || needs.changes.outputs.mac_installer == 'true')
    runs-on: macos-15
    outputs:
      # Checked by the release job before it signs: the bytes it signs are the bytes built here, not
      # whatever another job in the run may have uploaded under the same artifact name.
      pkg_sha256: ${{ steps.digests.outputs.pkg }}
      zip_sha256: ${{ steps.digests.outputs.zip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history so the tag can be checked against main below.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          # Never on a tag: a cache is written by every main-branch run, and a release is built from
          # scratch so nothing restored from one can reach the installer.
          enable-cache: ${{ github.ref_type != 'tag' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: ${{ github.ref_type != 'tag' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - name: Tag matches the version in the tree
        if: startsWith(github.ref, 'refs/tags/v')
        run: packaging/check_version.sh "$GITHUB_REF_NAME"
      - name: Cache helper downloads
        # Off on a tag, like the uv and npm caches: the release fetches and builds its helpers fresh.
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/build/helpers
          key: helpers-${{ hashFiles('packaging/fetch_helpers.sh', 'packaging/build_ffmpeg.sh') }}
      - name: Build
        # Only baked into the build (by packaging/build_app.sh) on a tagged release; a plain push to
        # main builds a keyless copy whose setup screen asks for keys instead, and which sends no
        # usage stats (no collector URL or key). Never printed.
        env:
          FLACKEY_TELEGRAM_API_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TELEGRAM_API_ID || '' }}
          FLACKEY_TELEGRAM_API_HASH: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TELEGRAM_API_HASH || '' }}
          FLACKEY_BUILD_TELEMETRY_URL: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TELEMETRY_URL || '' }}
          FLACKEY_BUILD_TELEMETRY_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TELEMETRY_KEY || '' }}
        run: packaging/build_app.sh
      - name: Smoke-launch
        # Whether the build above baked keys in, without handing the smoke test the keys themselves.
        env:
          SMOKE_EXPECT_KEYS: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: packaging/smoke.sh packaging/build/dist.noindex/Flackey.app
      - name: Update helper is inside the signed bundle
        # A bundle published without the helper looks perfect until someone presses Update months
        # later and nothing can swap it.
        run: |
          test -x packaging/build/dist.noindex/Flackey.app/Contents/Frameworks/bin/flackey-update-helper
          codesign --verify --deep --strict packaging/build/dist.noindex/Flackey.app
      - name: Installer
        id: digests
        run: |
          set -euo pipefail
          packaging/build_installer.sh
          cd packaging/build && shasum -a 256 Flackey.pkg > Flackey.pkg.sha256 && cat Flackey.pkg.sha256
          zips=(Flackey-*.zip)
          (( ${#zips[@]} == 1 )) || { echo "::error::expected one Flackey-*.zip, found ${#zips[@]}"; exit 1; }
          echo "pkg=$(shasum -a 256 Flackey.pkg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "zip=$(shasum -a 256 "${zips[0]}" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Flackey.installer
          path: |
            packaging/build/Flackey.pkg
            packaging/build/Flackey.pkg.sha256
            packaging/build/Flackey-*.zip
          if-no-files-found: error

  mac-intel:
    name: Flackey installer (Intel Mac)
    # The `mac` job again on GitHub's x86_64 image, so every binary in the bundle (Python, ffmpeg,
    # ffprobe, fpcalc, the update helper) is x86_64; slskd is fetched at run time for the app's own
    # architecture. Its assets get their own names (Flackey-Intel.pkg, Flackey-<v>-intel.zip) so the
    # Apple Silicon copies already installed, which look only for Flackey.pkg and Flackey-<v>.zip, see
    # exactly what they always did, and web/update.py points Intel copies at these.
    #
    # macos-15-intel is the last x86_64 macOS image GitHub offers; GitHub has said x86_64 macOS ends when
    # the macOS 15 images retire, around fall 2027 (changelog 2025-09-19). After that this job needs another plan.
    needs: [changes, python, web]
    if: >-
      !cancelled() && needs.python.result == 'success' && needs.web.result == 'success' &&
      (github.event_name == 'push' || needs.changes.outputs.mac_installer == 'true')
    runs-on: macos-15-intel
    outputs:
      pkg_sha256: ${{ steps.digests.outputs.pkg }}
      zip_sha256: ${{ steps.digests.outputs.zip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: ${{ github.ref_type != 'tag' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: ${{ github.ref_type != 'tag' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - name: Runner is x86_64
        run: test "$(uname -m)" = x86_64
      - name: Tag matches the version in the tree
        if: startsWith(github.ref, 'refs/tags/v')
        run: packaging/check_version.sh "$GITHUB_REF_NAME"
      - name: nasm for the ffmpeg build
        # ffmpeg's x86 assembly needs it; the arm64 build has none to assemble. Built from the release
        # tarball, pinned by SHA-256, rather than whatever Homebrew resolves on the day of a tag.
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/nasm-src" prefix="$RUNNER_TEMP/nasm"
          mkdir -p "$src"
          curl -fsSL --retry 3 -o "$src/nasm.tar.xz" https://www.nasm.us/pub/nasm/releasebuilds/3.02/nasm-3.02.tar.xz
          echo "87336eba53b4acfe917424ab5d500d2b0054d9f5148d35c2273ccf2cfb712f0d  $src/nasm.tar.xz" | shasum -a 256 -c -
          tar -xJf "$src/nasm.tar.xz" -C "$src"
          (cd "$src/nasm-3.02" && ./configure --prefix="$prefix" >/dev/null && make -j"$(sysctl -n hw.ncpu)" >/dev/null && make install >/dev/null)
          echo "$prefix/bin" >> "$GITHUB_PATH"
          "$prefix/bin/nasm" -v
      - name: Rust toolchain for cryptography
        # cryptography is compiled here (no x86_64 macOS wheel) and is what verifies update signatures, so
        # its compiler is pinned rather than whatever the runner image ships. rustup checks each component
        # against the release manifest's SHA-256.
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=1.99.1" >> "$GITHUB_ENV"
          RUSTUP_TOOLCHAIN=1.99.1 rustc --version
      - name: Cache helper downloads
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/build/helpers
          # Its own key: the arm64 job's cache holds an arm64 ffmpeg.
          key: helpers-intel-${{ hashFiles('packaging/fetch_helpers.sh', 'packaging/build_ffmpeg.sh') }}
      - name: Cache the static OpenSSL
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/build/openssl
          key: openssl-intel-${{ hashFiles('packaging/build_openssl.sh') }}
      - name: Static OpenSSL for cryptography
        # cryptography has no x86_64 macOS wheel, so uv builds it here; see build_openssl.sh for why it
        # must link OpenSSL statically. MACOSX_DEPLOYMENT_TARGET holds its Rust extension to macOS 12.
        run: |
          packaging/build_openssl.sh "$PWD/packaging/build/openssl"
          {
            echo "OPENSSL_DIR=$PWD/packaging/build/openssl"
            echo "OPENSSL_STATIC=1"
            echo "MACOSX_DEPLOYMENT_TARGET=12.0"
          } >> "$GITHUB_ENV"
          # Homebrew's OpenSSL sits in /usr/local/lib on this image, where ctypes' find_library (telethon
          # looks for libssl) finds it, and PyInstaller then bundles a libssl/libcrypto built for this
          # runner's macOS -- over the Python runtime's own libcrypto.3.dylib. Unlinked, the bundle gets
          # what the Apple Silicon build gets, whose Homebrew is outside the default search path.
          brew unlink openssl@3 || true
      - name: Wheels for macOS 12
        # Left to itself uv picks the wheels for this runner's macOS: numpy's macosx_14_0 build, which
        # will not load on 12 or 13. The lock also has macosx_10_13 wheels; targeting 12.0 selects them.
        # The Build step then runs on this environment as is (UV_NO_SYNC), rather than re-syncing it.
        #
        #
        # The packages with no x86_64 macOS wheel (cryptography, and two pure-Python sdists) are left out of
        # the sync and built here by `uv pip install`, because uv sync ignores build constraints. Each sdist
        # must match uv.lock's hash, and every build tool must be in intel-build-constraints.txt with its
        # hash (--require-build-hashes), so nothing in these builds resolves fresh at tag time. No cache:
        # a cached wheel would skip the build and with it the check. The log lists each build tool chosen.
        run: |
          set -euo pipefail
          built=(cryptography pyaes proxy-tools)
          skip=()
          for p in "${built[@]}"; do skip+=(--no-install-package "$p"); done
          uv sync --frozen --group bundle --python-platform x86_64-apple-darwin "${skip[@]}"
          uv run --no-sync python -I - "${built[@]}" > "$RUNNER_TEMP/sdists.txt" <<'PY'
          import sys, tomllib
          lock = {p["name"]: p for p in tomllib.load(open("uv.lock", "rb"))["package"]}
          for name in sys.argv[1:]:
              p = lock[name]
              print(f'{name}=={p["version"]} --hash={p["sdist"]["hash"]}')
          PY
          cat "$RUNNER_TEMP/sdists.txt"
          uv pip install --no-cache --no-deps --require-hashes --require-build-hashes \
            --no-binary "$(IFS=,; echo "${built[*]}")" \
            --build-constraint packaging/intel-build-constraints.txt \
            -r "$RUNNER_TEMP/sdists.txt" -v 2> "$RUNNER_TEMP/builds.log" \
            || { tail -40 "$RUNNER_TEMP/builds.log"; exit 1; }
          echo "Build tools used:"
          grep -oE 'Selecting: [^ ]+' "$RUNNER_TEMP/builds.log" | sort -u
          grep -E '^ \+ ' "$RUNNER_TEMP/builds.log" || true
      - name: Build
        # Keys and the stats collector exactly as the `mac` job: only on a tagged release. Never printed.
        env:
          UV_NO_SYNC: "1"
          FLACKEY_TELEGRAM_API_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TELEGRAM_API_ID || '' }}
          FLACKEY_TELEGRAM_API_HASH: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TELEGRAM_API_HASH || '' }}
          FLACKEY_BUILD_TELEMETRY_URL: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TELEMETRY_URL || '' }}
          FLACKEY_BUILD_TELEMETRY_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TELEMETRY_KEY || '' }}
        run: packaging/build_app.sh
      - name: Every Mach-O in the bundle is x86_64 and runs on macOS 12
        run: |
          set -euo pipefail
          app=packaging/build/dist.noindex/Flackey.app
          bad=0; n=0
          while IFS= read -r -d '' f; do
            file -b "$f" | grep -q '^Mach-O' || continue
            n=$((n + 1))
            archs="$(lipo -archs "$f")"
            case " $archs " in *" x86_64 "*) ;; *) echo "::error::$f is $archs"; bad=1 ;; esac
            minos="$(vtool -arch x86_64 -show-build "$f" 2>/dev/null | awk '/minos/ {print $2; exit}')"
            [[ -z "$minos" ]] && minos="$(otool -arch x86_64 -l "$f" | awk '/LC_VERSION_MIN_MACOSX/ {getline; getline; print $2; exit}')"
            if [[ -z "$minos" ]]; then
              echo "::error::$f has no minimum macOS"; bad=1
            elif [[ "$(printf '%s\n12.0\n' "$minos" | sort -V | tail -1)" != 12.0 ]]; then
              echo "::error::$f needs macOS $minos"; bad=1
            fi
          done < <(find "$app" -type f -print0)
          echo "$n Mach-O files checked"
          # `if`, not a bare (( )): the bare form once let a run with errors above pass.
          if (( n == 0 || bad != 0 )); then exit 1; fi
          rust="$(find "$app" -name '_rust.abi3.so' | head -1)"
          [[ -n "$rust" ]] || { echo "::error::cryptography's extension is missing"; exit 1; }
          if otool -L "$rust" | grep -qE 'libssl|libcrypto'; then
            echo "::error::cryptography links OpenSSL dynamically"; exit 1
          fi
      - name: Smoke-launch
        env:
          SMOKE_EXPECT_KEYS: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: packaging/smoke.sh packaging/build/dist.noindex/Flackey.app
      - name: Update helper is inside the signed bundle
        run: |
          test -x packaging/build/dist.noindex/Flackey.app/Contents/Frameworks/bin/flackey-update-helper
          codesign --verify --deep --strict packaging/build/dist.noindex/Flackey.app
      - name: Installer
        id: digests
        run: |
          set -euo pipefail
          packaging/build_installer.sh
          cd packaging/build
          zips=(Flackey-*.zip)
          (( ${#zips[@]} == 1 )) || { echo "::error::expected one Flackey-*.zip, found ${#zips[@]}"; exit 1; }
          mv Flackey.pkg Flackey-Intel.pkg
          zip="${zips[0]%.zip}-intel.zip"
          mv "${zips[0]}" "$zip"
          shasum -a 256 Flackey-Intel.pkg > Flackey-Intel.pkg.sha256 && cat Flackey-Intel.pkg.sha256
          echo "pkg=$(shasum -a 256 Flackey-Intel.pkg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "zip=$(shasum -a 256 "$zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Update helper and swap on x86_64
        # python-mac proves these on Apple Silicon only; this is the Intel helper the seamless update runs.
        env:
          UV_NO_SYNC: "1"
        run: uv run pytest -q tests/test_update_helper.py tests/test_update_helper_relaunch.py tests/test_update_helper_swap_race.py tests/test_selfupdate_install.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Flackey.installer-intel
          path: |
            packaging/build/Flackey-Intel.pkg
            packaging/build/Flackey-Intel.pkg.sha256
            packaging/build/Flackey-*-intel.zip
          if-no-files-found: error

  windows:
    name: Flackey installer (Windows x64)
    needs: [python, web]
    # Unlike the mac job, pull requests too: see the header.
    runs-on: windows-latest
    outputs:
      # Checked by the release job before it signs (see the mac job).
      setup_sha256: ${{ steps.digest.outputs.setup }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out with LF line endings
        # Otherwise check_version.sh arrives with CRLF endings and bash stops at the first carriage return.
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history so the tag can be checked against main below.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          # Never on a tag: a cache is written by every main-branch run, and a release is built from
          # scratch so nothing restored from one can reach the installer.
          enable-cache: ${{ github.ref_type != 'tag' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: ${{ github.ref_type != 'tag' && 'npm' || '' }}
          cache-dependency-path: web/package-lock.json
      - name: Tag matches the version in the tree
        if: startsWith(github.ref, 'refs/tags/v')
        # The same script the mac job runs, under the runner's Git Bash.
        shell: bash
        run: packaging/check_version.sh "$GITHUB_REF_NAME"
      - name: Inno Setup
        # Preinstalled on the windows-latest image (actions/runner-images lists InnoSetup 6.7.1); installed
        # here only if an image update ever drops it, at that same version rather than whatever is newest.
        # build_windows.ps1 finds ISCC.exe either way.
        run: |
          if (Get-Command ISCC.exe -ErrorAction SilentlyContinue) {
            Write-Host "Inno Setup on PATH"
          } elseif (Test-Path -LiteralPath (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')) {
            Write-Host "Inno Setup in Program Files (x86)"
          } else {
            choco install innosetup --version 6.7.1 -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Cache helper downloads
        id: helpers-cache
        # Off on a tag (see the mac job); a skipped step reports no cache hit, so MSYS2 is installed.
        if: github.ref_type != 'tag'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: packaging/build/helpers
          key: helpers-windows-${{ hashFiles('packaging/fetch_helpers_windows.ps1', 'packaging/build_ffmpeg.sh') }}
      - name: MSYS2 toolchain for the ffmpeg build
        # MSYS2 is preinstalled at C:\msys64 on windows-latest, without a compiler. Only needed when the
        # cache above missed: a hit already holds the built ffmpeg.exe and build_ffmpeg.sh reuses it.
        if: steps.helpers-cache.outputs.cache-hit != 'true'
        run: |
          C:\msys64\usr\bin\bash.exe -lc "pacman -S --needed --noconfirm make diffutils mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zlib"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        # Same gating as the mac job: the Telegram keys and the usage-stats collector URL and key only on
        # a tagged release, never on a push or PR artifact. Set on this step only, so the steps before it
        # (choco, MSYS2's pacman) never see them; build_windows.ps1 itself runs npm, uv and PyInstaller
        # with them in its environment. They are baked into the app, which ships publicly. Never printed.
        env:
          FLACKEY_TELEGRAM_API_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TELEGRAM_API_ID || '' }}
          FLACKEY_TELEGRAM_API_HASH: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TELEGRAM_API_HASH || '' }}
          FLACKEY_BUILD_TELEMETRY_URL: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TELEMETRY_URL || '' }}
          FLACKEY_BUILD_TELEMETRY_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TELEMETRY_KEY || '' }}
        run: ./packaging/build_windows.ps1
      - name: Smoke-launch
        # Whether the build above baked keys in, without handing the smoke test the keys themselves.
        env:
          SMOKE_EXPECT_KEYS: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: ./packaging/smoke_windows.ps1 packaging/build/dist/Flackey/Flackey.exe
      - name: Slim ffmpeg gives the full build's answers
        # tests/test_slim_ffmpeg.py on the Windows ffmpeg.exe and ffprobe.exe this installer ships,
        # against gyan.dev's full build (pinned) for the fixtures and the reference answers.
        run: |
          $full = Join-Path $env:RUNNER_TEMP 'full-ffmpeg'
          New-Item -ItemType Directory -Force -Path $full | Out-Null
          $ff = 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1'
          $pins = @{ 'ffmpeg' = '8883a3dffbd0a16cf4ef95206ea05283f78908dbfb118f73c83f4951dcc06d77'
                     'ffprobe' = 'f309e6223ad89d2fe54bccd420a7709b66fd27540674e92309578ed491a43c8d' }
          foreach ($tool in $pins.Keys) {
            $gz = Join-Path $full "$tool.gz"
            curl.exe -fsSL --retry 3 -o $gz "$ff/$tool-win32-x64.gz"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ((Get-FileHash -Algorithm SHA256 $gz).Hash.ToLowerInvariant() -ne $pins[$tool]) { throw "checksum mismatch for $tool" }
            $in = [IO.File]::OpenRead($gz)
            $gzs = New-Object IO.Compression.GZipStream($in, [IO.Compression.CompressionMode]::Decompress)
            $out = [IO.File]::Create((Join-Path $full "$tool.exe"))
            $gzs.CopyTo($out); $out.Dispose(); $gzs.Dispose(); $in.Dispose()
          }
          $slim = (Resolve-Path packaging/build/bin).Path
          # The full build first, so fixtures are made with it; fpcalc from the slim folder.
          $env:PATH = "$full;$slim;$env:PATH"
          $env:FLACKEY_SLIM_FFMPEG = $slim
          uv run pytest -q -rs tests/test_slim_ffmpeg.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installer digest
        id: digest
        run: |
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath packaging/build/Flackey-Setup.exe).Hash.ToLowerInvariant()
          "setup=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Flackey.windows
          path: |
            packaging/build/Flackey-Setup.exe
            packaging/build/Flackey-Setup.exe.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    # The test jobs no installer waits on, too: python-mac is the one that proves the update helper
    # still refuses what it should.
    needs: [mac, mac-intel, windows, python-audio, python-mac, python-windows]
    # `mac` needs `changes`, which is skipped on a push; a skipped job anywhere upstream makes the
    # default rule skip this one too, so the expression restates "every need succeeded".
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
      needs.mac.result == 'success' && needs.mac-intel.result == 'success' &&
      needs.windows.result == 'success' &&
      needs.python-audio.result == 'success' && needs.python-mac.result == 'success' &&
      needs.python-windows.result == 'success'
    runs-on: ubuntu-latest
    # The update signing key belongs in this Environment's secrets, with a deployment rule that admits
    # only v* tags: then a workflow pushed on some branch cannot read it, as it can a repo-level secret.
    # Until the key is moved there, `secrets.FLACKEY_UPDATE_SIGNING_KEY` still resolves to the
    # repo-level one (an Environment secret only overrides a repo secret of the same name), and GitHub
    # creates the Environment the first time a job names it. No required reviewers: releases stay
    # automatic.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      # A tag on main is a release. A tag anywhere else (a branch build handed to a tester) is published
      # only as a pre-release: the in-app update check skips pre-releases, so no installed copy is ever
      # offered a commit that has not reached main.
      - name: Tagged commit is on main, or this is a pre-release
        id: channel
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Pre-release::$GITHUB_SHA is not on main; publishing $GITHUB_REF_NAME as a pre-release."
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          # No cache in the job that holds the signing key: a cache is written by every other job and
          # every pull request, and nothing it restores should reach the step that signs a release.
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Flackey.installer
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Flackey.windows
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Flackey.installer-intel
          path: dist
      - name: The artifacts are the bytes the build jobs made
        # The .sha256 files inside the artifacts travel with the bytes they describe, so they prove
        # nothing; the digests come from the build jobs' outputs instead.
        env:
          PKG_SHA256: ${{ needs.mac.outputs.pkg_sha256 }}
          ZIP_SHA256: ${{ needs.mac.outputs.zip_sha256 }}
          SETUP_SHA256: ${{ needs.windows.outputs.setup_sha256 }}
          INTEL_PKG_SHA256: ${{ needs.mac-intel.outputs.pkg_sha256 }}
          INTEL_ZIP_SHA256: ${{ needs.mac-intel.outputs.zip_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          for v in PKG_SHA256 ZIP_SHA256 SETUP_SHA256 INTEL_PKG_SHA256 INTEL_ZIP_SHA256; do
            [[ "${!v}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error title=No build digest::$v is missing."; exit 1; }
          done
          sha256sum --strict -c - <<SUMS
          $PKG_SHA256  dist/Flackey.pkg
          $ZIP_SHA256  dist/Flackey-${GITHUB_REF_NAME#v}.zip
          $SETUP_SHA256  dist/Flackey-Setup.exe
          $INTEL_PKG_SHA256  dist/Flackey-Intel.pkg
          $INTEL_ZIP_SHA256  dist/Flackey-${GITHUB_REF_NAME#v}-intel.zip
          SUMS
      - name: Sign the update archive
        # Here rather than in the mac job: this is the only step that needs the private key, and it
        # should not run alongside npm install and PyInstaller.
        #
        # A missing signing key fails the release: installed copies only take a seamless update
        # that verifies against this key, so an unsigned release must never be published.
        env:
          FLACKEY_UPDATE_SIGNING_KEY: ${{ secrets.FLACKEY_UPDATE_SIGNING_KEY }}
        # The script reads the signed-message format straight out of src/, so it needs only cryptography,
        # not the app's macOS-shaped dependencies. Since this step holds the private key, cryptography and
        # what it depends on are installed by hash, exactly as uv.lock resolved them: `uv export --hashes`
        # cut down to that closure by signing_requirements.py, then `--require-hashes`, wheels only.
        run: |
          set -euo pipefail
          if [[ -z "${FLACKEY_UPDATE_SIGNING_KEY// /}" ]]; then
            echo "::error title=No signing key::FLACKEY_UPDATE_SIGNING_KEY is empty; refusing to publish an unsigned release."
            exit 1
          fi
          venv="$RUNNER_TEMP/signing-venv"
          reqs="$RUNNER_TEMP/signing-requirements.txt"
          uv venv --quiet --python 3.12 "$venv"
          uv export --frozen --no-emit-project --no-dev --format requirements-txt \
            | "$venv/bin/python" -I packaging/signing_requirements.py uv.lock cryptography > "$reqs"
          uv pip install --quiet --python "$venv/bin/python" --require-hashes --no-deps --only-binary :all: -r "$reqs"
          sign() { "$venv/bin/python" packaging/sign_archive.py "$@"; }
          sign dist/Flackey-"${GITHUB_REF_NAME#v}".zip
          sign dist/Flackey.pkg "${GITHUB_REF_NAME#v}"
          sign dist/Flackey-Setup.exe "${GITHUB_REF_NAME#v}"
          # The Intel pair, with the same key and the same two domains as the Apple Silicon pair. The
          # version is passed, not read from the name: `Flackey-<v>-intel.zip` would parse as "<v>-intel".
          sign dist/Flackey-"${GITHUB_REF_NAME#v}"-intel.zip "${GITHUB_REF_NAME#v}"
          sign dist/Flackey-Intel.pkg "${GITHUB_REF_NAME#v}"
          test -s dist/Flackey-"${GITHUB_REF_NAME#v}".zip.sig
          test -s dist/Flackey.pkg.sig
          test -s dist/Flackey-Setup.exe.sig
          test -s dist/Flackey-"${GITHUB_REF_NAME#v}"-intel.zip.sig
          test -s dist/Flackey-Intel.pkg.sig
        shell: bash
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          zip="dist/Flackey-${GITHUB_REF_NAME#v}.zip"
          intel_zip="dist/Flackey-${GITHUB_REF_NAME#v}-intel.zip"
          # Flackey-Setup.exe keeps the same name every release, like Flackey.pkg: it is the name the
          # Windows update check looks for.
          assets=(dist/Flackey.pkg dist/Flackey.pkg.sha256
                  dist/Flackey-Intel.pkg dist/Flackey-Intel.pkg.sha256
                  dist/Flackey-Setup.exe dist/Flackey-Setup.exe.sha256)
          # Every signed file is mandatory: installed copies refuse an update or installer without one.
          for f in "$zip" "$zip.sig" "$intel_zip" "$intel_zip.sig" dist/Flackey.pkg.sig \
                   dist/Flackey-Intel.pkg.sig dist/Flackey-Setup.exe.sig; do
            [[ -f "$f" ]] || { echo "::error title=Missing asset::$f is missing."; exit 1; }
            assets+=("$f")
          done
          # One checksum file for every published file, the update archive included.
          (cd dist && sha256sum "${assets[@]#dist/}" > SHA256SUMS)
          assets+=(dist/SHA256SUMS)
          channel=()
          [[ "$PRERELEASE" == "true" ]] && channel=(--prerelease --latest=false)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${channel[@]}" \
            --verify-tag --title "Flackey ${GITHUB_REF_NAME#v}" --generate-notes
