version: 2
# Every ecosystem waits 7 days after a release before proposing it, so a hijacked release has time to be
# noticed and pulled before it reaches a PR (and, for actions, the release job). Cooldown applies to
# version updates only: security updates still open at once.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # Majors come as their own PRs. Grouping them with the safe bumps meant one
      # broken major (typescript 7 dropping implicit CSS side-effect typing) took
      # nine unrelated updates down with it.
      web-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # The python base image is pinned by pyproject.toml's requires-python
      # (">=3.12,<3.13"), not upgradable on its own -- `uv sync --frozen` refuses.
      # Bump requires-python first, then this follows.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # init and analyze must run the same version: bumped apart, each PR fails CodeQL with
      # "Loaded a configuration file for version X, but running version Y".
      codeql-action:
        patterns: ["github/codeql-action*"]
