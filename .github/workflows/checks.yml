# Every push and pull request: the four checks the README lists for development, plus a type-checked
# build of the web UI. Green here is the gate for the macOS build job (added with the release work).
name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ruff, lint-imports, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: ruff
        run: uv run ruff check src tests
      - name: lint-imports
        run: uv run lint-imports
      - name: pytest
        run: uv run pytest -q

  web:
    name: vitest and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm --prefix web ci
      - name: vitest
        run: npm --prefix web test -- --run
      - name: build
        run: npm --prefix web run build
