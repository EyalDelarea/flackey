[project]
name = "flackey"
version = "0.1.1"
description = "Personal DJ library builder with a desktop GUI: paste a link -> verified, tagged tracks -> Rekordbox"
requires-python = ">=3.12,<3.13"
dependencies = [
  "telethon>=1.44,<2",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "curl_cffi>=0.7",
  "httpx>=0.27",
  "yt-dlp>=2026.8",
  "mutagen>=1.47",
  "rapidfuzz>=3.9",
  "numpy>=2.0",
  "typer>=0.12",
  "pydantic-settings>=2.4",
  "pywebview>=6.2.1",
  "pyyaml>=6",
]

[project.scripts]
flackey = "flackey.cli:app"
# `crate` is from cratedigger, two names ago, and it is the one the owner's fingers and shell history
# still reach for -- so it stays. `krater` deliberately does not: it existed for a day and nobody typed
# it. Aliases are cheap, but only worth keeping for names that were actually used.
crate = "flackey.cli:app"

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flackey"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.importlinter]
root_package = "flackey"

[[tool.importlinter.contracts]]
name = "cli -> app -> surfaces -> worker -> adapters -> domain -> leaves"
type = "layers"
containers = ["flackey"]
layers = [
  "cli",
  "desktop",
  "app",
  "web",
  "soulseek_link : sharing",
  "worker : events : inbox",
  "attempts",
  "library : export : tag : verify : store : catalog : deezer : youtube : source : telegram : convert : fingerprint",
  "lossless",
  "match : identify",
  "notify : config : models : logsetup",
  "tools",
  "slskd_process",
  "slskd_binary",
  "slskd_config",
  "portmap : portcheck",
]
exhaustive = true
