name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.4 or v0.1.4"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Bump version, tag, and hand off to the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # A PAT, not the default GITHUB_TOKEN: pushes/PRs made with GITHUB_TOKEN don't
          # trigger other workflows, so the checks + build this release depends on would
          # never run and the auto-merge below would wait forever.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Validate requested version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          raw="$RAW_VERSION"
          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid version::Use X.Y.Z or vX.Y.Z, got '$raw'."
            exit 1
          fi

          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check for an existing tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          git fetch --tags origin

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error title=Tag already exists::$tag already exists. Pick a new version."
            exit 1
          fi

      - name: Bump version in the tree
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          sed -i -E "s/^version = \"[^\"]*\"/version = \"$version\"/" pyproject.toml
          sed -i -E "s/^__version__ = \"[^\"]*\"/__version__ = \"$version\"/" src/flackey/__init__.py
          packaging/check_version.sh "${{ steps.version.outputs.tag }}"

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open and auto-merge the version bump PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          branch="release/$tag"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "release: $tag"
          git push origin "$branch"

          gh pr create --base main --head "$branch" --title "release: $tag" \
            --body "Automated version bump for $tag." --label ignore-for-release
          gh pr merge "$branch" --auto --squash

      - name: Wait for the version bump to land on main
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          branch="release/${{ steps.version.outputs.tag }}"
          for _ in $(seq 1 80); do
            state="$(gh pr view "$branch" --json state -q .state)"
            case "$state" in
              MERGED) echo "$branch merged."; exit 0 ;;
              CLOSED) echo "::error::PR for $branch was closed without merging."; exit 1 ;;
            esac
            sleep 15
          done

          echo "::error::Timed out waiting for $branch to merge."
          exit 1

      - name: Tag the released commit
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.tag }}"
          git fetch origin main
          git checkout -B main origin/main
          packaging/check_version.sh "$tag"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag"
          git push origin "$tag"
