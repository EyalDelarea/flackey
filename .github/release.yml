# Groups `gh release create --generate-notes` output (checks.yml's release job) by PR label.
# See docs/RELEASING.md for the full release process.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
      - question
      - ignore-for-release
  categories:
    - title: 🚀 Features
      labels:
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: 📝 Documentation
      labels:
        - documentation
    - title: 🧹 Chores
      labels:
        - chore
    # Dependabot's noise gets its own bucket at the bottom, so it stops sharing
    # "Other Changes" with human PRs that simply missed a category label.
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
