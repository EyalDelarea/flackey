# Nudges every PR to carry a release-category label so .github/release.yml can group it
# in the auto-generated release notes. Advisory only: not a required check.
name: pr-labels

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize, reopened]

permissions: {}

jobs:
  require-category-label:
    runs-on: ubuntu-latest
    steps:
      - name: Require a release-category label
        uses: actions/github-script@v9
        with:
          script: |
            const categories = [
              "enhancement",
              "bug",
              "documentation",
              "chore",
              "dependencies",
              "ignore-for-release",
            ];
            const labels = context.payload.pull_request.labels.map((l) => l.name);
            const matched = labels.filter((l) => categories.includes(l));
            if (matched.length === 0) {
              core.setFailed(`Add one release-category label: ${categories.join(", ")}`);
            }
