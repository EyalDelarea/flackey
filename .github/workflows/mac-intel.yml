# A one-off Intel (x86_64) build of the Mac app, for someone on an Intel Mac. Manual only: run it from the
# Actions tab ("Run workflow") on the branch or commit you want. It uploads Flackey.pkg and the .app zip as
# a workflow artifact and nothing else -- no tag, no release, no update signature, no update manifest.
#
# Releases stay Apple Silicon only. The copy this builds refuses in-app updates (web/update.py
# `releases_fit_this_build`), since every published update is arm64 and would not open on an Intel Mac.
#
# Keyless on purpose: the Telegram keys and the usage-stats collector are tag-build secrets and stay that
# way. The setup screen asks for Telegram keys, and the copy sends no usage stats.
name: mac intel build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-intel:
    name: Flackey installer (Intel, one-off)
    # GitHub's x86_64 macOS image (macos-13 was retired in December 2025).
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Runner is x86_64
        run: test "$(uname -m)" = x86_64
      - name: nasm for the ffmpeg build
        # ffmpeg's x86 assembly needs it; on arm64 there is none, so the release job never installs it.
        run: brew install nasm
      - name: OpenSSL linked into cryptography
        # cryptography publishes no x86_64 macOS wheel, so uv builds it from source here. Linked against
        # Homebrew's libssl.3.dylib it loads whichever libssl.3.dylib the bundle holds -- the Python
        # runtime's older one -- and fails at import (_SSL_get0_group_name). Static linking avoids that.
        # Homebrew's OpenSSL targets this runner's macOS (15), which is the floor of this one-off build.
        run: |
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
      - name: Build
        # No key or collector env: build_app.sh then bakes neither.
        run: packaging/build_app.sh
      - name: Every Mach-O in the bundle is x86_64
        run: |
          set -euo pipefail
          app=packaging/build/dist.noindex/Flackey.app
          bad=0; n=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q '^Mach-O'; then
              n=$((n + 1))
              archs="$(lipo -archs "$f")"
              case " $archs " in *" x86_64 "*) ;; *) echo "::error::$f is $archs"; bad=1 ;; esac
            fi
          done < <(find "$app" -type f -print0)
          echo "$n Mach-O files checked"
          if (( n == 0 || bad != 0 )); then exit 1; fi  # bash 3.2 ignores a failed (( )) under set -e
          rust="$(find "$app" -name '_rust.abi3.so' | head -1)"
          if otool -L "$rust" | grep -q 'libssl\|libcrypto'; then echo "::error::cryptography links OpenSSL dynamically"; exit 1; fi
          echo "minimum macOS per Mach-O:"
          find "$app" -type f -print0 | while IFS= read -r -d '' f; do
            file -b "$f" | grep -q '^Mach-O' || continue
            m="$(vtool -show-build "$f" 2>/dev/null | awk '/minos/ {print $2; exit}')"
            [[ -z "$m" ]] && m="$(otool -l "$f" | awk '/LC_VERSION_MIN_MACOSX/ {getline; getline; print $2; exit}')"
            echo "$m"
          done | sort -V | uniq -c
          for f in Contents/MacOS/Flackey Contents/Frameworks/bin/{ffmpeg,ffprobe,fpcalc,flackey-update-helper}; do
            echo "$f: $(lipo -archs "$app/$f")"
          done
      - name: Smoke-launch
        id: smoke
        # Does not stop the artifact: a failure here is diagnosed below, and the build can still be tried.
        continue-on-error: true
        env:
          SMOKE_EXPECT_KEYS: "false"
        run: packaging/smoke.sh packaging/build/dist.noindex/Flackey.app
      - name: Why the smoke launch failed
        if: steps.smoke.outcome == 'failure'
        run: |
          set +e
          ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -5
          for r in $(ls -t ~/Library/Logs/DiagnosticReports/Flackey* 2>/dev/null | head -1); do head -80 "$r"; done
          d="$(mktemp -d)"; mkdir -p "$d/data" "$d/lib"
          DATA_DIR="$d/data" LIBRARY_ROOT="$d/lib" WEB_PORT=8798 FLACKEY_API_TOKEN=x \
            packaging/build/dist.noindex/Flackey.app/Contents/MacOS/Flackey > "$d/out.txt" 2>&1 &
          for _ in $(seq 1 60); do curl -s -m 2 -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8798/api/health && break; sleep 2; done
          tail -60 "$d/out.txt"; tail -60 "$d/data/flackey.log" 2>/dev/null; kill %1 2>/dev/null; true
      - name: Installer
        run: |
          set -euo pipefail
          packaging/build_installer.sh
          cd packaging/build
          mv Flackey.pkg Flackey-intel.pkg
          for z in Flackey-*.zip; do mv "$z" "${z%.zip}-intel.zip"; done
          shasum -a 256 Flackey-intel.pkg Flackey-*-intel.zip | tee SHA256SUMS-intel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Flackey-intel
          path: |
            packaging/build/Flackey-intel.pkg
            packaging/build/Flackey-*-intel.zip
            packaging/build/SHA256SUMS-intel
          if-no-files-found: error
          retention-days: 30
      - name: Smoke launch passed
        # Last, so a failed launch still leaves an artifact to inspect, but never a green run.
        if: steps.smoke.outcome == 'failure'
        run: exit 1
