# Every push and pull request: the four checks the README lists for development, plus a type-checked
# build of the web UI. On a push to main (or a version tag) the green checks gate a macOS installer
# build; on a version tag that installer is published as a GitHub Release.
name: checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: ruff, lint-imports, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: ruff
        run: uv run ruff check src tests
      - name: lint-imports
        run: uv run lint-imports
      - name: pytest
        run: uv run pytest -q

  web:
    name: vitest and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm --prefix web ci
      - name: vitest
        run: npm --prefix web test -- --run
      - name: build
        run: npm --prefix web run build

  mac:
    name: Flackey installer (Apple Silicon)
    needs: [python, web]
    if: github.event_name == 'push'
    runs-on: macos-14
    env:
      # Baked into the build by packaging/build_app.sh; never printed.
      FLACKEY_TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      FLACKEY_TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Tag matches the version in the tree
        if: startsWith(github.ref, 'refs/tags/v')
        run: packaging/check_version.sh "$GITHUB_REF_NAME"
      - name: Cache helper downloads
        uses: actions/cache@v4
        with:
          path: packaging/build/helpers
          key: helpers-${{ hashFiles('packaging/fetch_helpers.sh') }}
      - name: Build
        run: packaging/build_app.sh
      - name: Smoke-launch
        run: packaging/smoke.sh packaging/build/dist/Flackey.app
      - name: Installer
        run: |
          packaging/build_installer.sh
          cd packaging/build && shasum -a 256 Flackey.pkg > Flackey.pkg.sha256 && cat Flackey.pkg.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Flackey.installer
          path: |
            packaging/build/Flackey.pkg
            packaging/build/Flackey.pkg.sha256
          if-no-files-found: error

  release:
    name: GitHub release
    needs: mac
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Flackey.installer
          path: dist
      - name: latest.json
        run: packaging/latest_json.sh "$GITHUB_REF_NAME" dist/Flackey.pkg dist/Flackey.pkg.sha256 | tee dist/latest.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Flackey.pkg dist/Flackey.pkg.sha256 dist/latest.json \
            --verify-tag --prerelease --title "Flackey ${GITHUB_REF_NAME#v}v (Beta)" --generate-notes
